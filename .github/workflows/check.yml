name: Mortar contribution checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read

jobs:
  quality:
    name: Mortar baseline and browser checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts
      - name: Check public kit
        id: kit-check
        run: npm run check
      - run: npx playwright install --with-deps chromium
      # Both suites serve the playground-dist that npm run check built.
      - run: npm run test:browser
        env:
          MORTAR_PLAYGROUND_PREBUILT: "1"
      - name: Compare curated visual baselines
        run: npm run test:visual
        env:
          MORTAR_PLAYGROUND_PREBUILT: "1"
      # The GitHub Pages site: site/index.html at the root and the playground
      # under playground/. A relative base keeps the build valid at
      # https://mortar.tony.codes/ and on any later custom domain.
      - name: Build the GitHub Pages site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          rm -rf pages-site
          npm run build:playground -- --base ./ --outDir ../pages-site/playground
          cp site/index.html pages-site/index.html
          touch pages-site/.nojekyll
          echo "$GITHUB_SHA" > pages-site/commit.txt
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner -czf site.tar.gz -C pages-site .
      - name: Upload the checked GitHub Pages site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: mortar-pages-${{ github.sha }}
          path: site.tar.gz
          if-no-files-found: error
          retention-days: 14
      - name: Upload interactive review playground
        if: always() && steps.kit-check.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: mortar-playground-${{ github.sha }}
          path: playground-dist/
          retention-days: 14
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mortar-browser-evidence-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
            visual-results/
            visual-report/
          retention-days: 14
      - name: Review instructions
        if: always()
        run: |
          echo '## Component review' >> "$GITHUB_STEP_SUMMARY"
          echo 'Review this exact commit in the pull request. Download the playground artifact, extract it, and serve it locally with `python3 -m http.server 4340 --bind 127.0.0.1`. Open http://127.0.0.1:4340. Inspect the browser-report artifact for both-theme screenshots and accessibility results.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Artifacts contain untrusted contribution code. Use a separate browser profile; do not serve them on the production origin. GitHub maintainer review is the only review gate.' >> "$GITHUB_STEP_SUMMARY"

# No package-publishing or deployment credentials belong in this workflow.
