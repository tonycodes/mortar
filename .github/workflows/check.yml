name: Mortar contribution checks
on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]
permissions:
  contents: read

jobs:
  quality:
    name: Mortar baseline and browser checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts
      - name: Check public kit
        id: kit-check
        run: npm run check
      - name: Test deployment receiver safety
        run: python3 -m unittest discover -s ops/tests
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Compare curated visual baselines
        run: npm run test:visual
      - name: Build production playground
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          npm run build:playground -- --base /playground/ --outDir ../playground-production
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner -czf release.tar.gz -C playground-production .
      - name: Upload checked production playground
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: mortar-playground-production-${{ github.sha }}
          path: release.tar.gz
          if-no-files-found: error
          retention-days: 14
      - name: Upload interactive review playground
        if: always() && steps.kit-check.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: mortar-playground-${{ github.sha }}
          path: playground-dist/
          retention-days: 14
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mortar-browser-evidence-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
            visual-results/
            visual-report/
          retention-days: 14
      - name: Review instructions
        if: always()
        run: |
          echo '## Component review' >> "$GITHUB_STEP_SUMMARY"
          echo 'Review this exact commit in the pull request. Download the playground artifact, extract it, and serve it locally with `python3 -m http.server 4340 --bind 127.0.0.1`. Open http://127.0.0.1:4340. Inspect the browser-report artifact for both-theme screenshots and accessibility results.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Artifacts contain untrusted contribution code. Use a separate browser profile; do not serve them on the production/authentication origin. No cloud approval is required after GitHub maintainer review.' >> "$GITHUB_STEP_SUMMARY"

# No package-publishing or cloud-governance credentials belong in this workflow.
