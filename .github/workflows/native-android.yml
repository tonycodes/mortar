name: Mortar for Compose
on:
  pull_request:
    paths:
      - native/android/**
      - .github/workflows/native-android.yml
  push:
    branches: [main]
    paths:
      - native/android/**
      - .github/workflows/native-android.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Compose library and snapshots
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: native/android
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11.1"
      - name: Unit and snapshot tests
        id: verify
        run: gradle :mortar:verifyPaparazziDebug
      # Paparazzi renders on the JVM, so CI's recording matches any machine's.
      # On a failure, record what the code renders now to review and commit.
      - name: Record snapshots after a failure
        if: failure() && steps.verify.conclusion == 'failure'
        run: gradle :mortar:recordPaparazziDebug
      - name: Upload snapshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mortar-compose-snapshots-${{ github.sha }}
          path: |
            native/android/mortar/src/test/snapshots
            native/android/mortar/build/paparazzi/failures
          if-no-files-found: ignore
      - name: Build the release artefact
        run: gradle :mortar:publishToMavenLocal -Pversion=0.0.0-ci
