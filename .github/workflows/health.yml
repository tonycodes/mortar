# Weekly full check on main. Opens one issue when the run fails so browser
# or OS drift is visible without waiting for a PR. No secrets, no publish.
name: Weekly health check
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
permissions:
  contents: read
  issues: write

jobs:
  health:
    name: Mortar weekly health
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts
      - run: npm run check
        env:
          MORTAR_NATIVE_COMPILE: "1"
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
        env:
          MORTAR_PLAYGROUND_PREBUILT: "1"
      - run: npm run test:visual
        env:
          MORTAR_PLAYGROUND_PREBUILT: "1"
      - name: Upload evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: mortar-health-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
            visual-results/
            visual-report/
          retention-days: 14
      - name: Open an issue on failure
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            const title = "Weekly health check failed";
            const marker = "<!-- mortar-weekly-health -->";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              marker,
              "",
              "The scheduled [Weekly health check](.github/workflows/health.yml) failed on `main`.",
              "",
              `- Run: ${runUrl}`,
              `- Commit: ${context.sha}`,
              "",
              "This catches drift from browser or OS updates. Fix on a branch and close this issue when green.",
            ].join("\n");

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 50,
            });
            const existing = issues.find(
              (issue) =>
                issue.title === title &&
                typeof issue.body === "string" &&
                issue.body.includes(marker),
            );
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Another failure: ${runUrl} at ${context.sha}.`,
              });
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ["bug"],
            });
