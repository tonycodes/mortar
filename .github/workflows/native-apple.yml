name: Mortar for SwiftUI
on:
  pull_request:
    paths:
      - Package.swift
      - native/apple/**
      - .github/workflows/native-apple.yml
  push:
    branches: [main]
    paths:
      - Package.swift
      - native/apple/**
      - .github/workflows/native-apple.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-apple-${{ github.ref }}
  cancel-in-progress: true
env:
  # The snapshot references are recorded with this Xcode and simulator;
  # rendering differs between versions, so change them only together with
  # re-recorded images.
  DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
  SIMULATOR: platform=iOS Simulator,name=iPhone 16,OS=18.6
jobs:
  test:
    name: Swift package and snapshots
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          xcodebuild -version
          xcrun simctl list runtimes available
          xcodebuild -list
      - name: Build for Mac
        run: xcodebuild build -scheme Mortar -destination 'platform=macOS' -quiet
      - name: Test on the iOS simulator
        env:
          # xcodebuild passes TEST_RUNNER_ variables to the tests, unprefixed.
          TEST_RUNNER_SNAPSHOT_ARTIFACTS: ${{ runner.temp }}/snapshot-failures
        run: |
          xcodebuild test -scheme Mortar \
            -destination "$SIMULATOR"
      # New references (recorded where none exist, which fails the test) and
      # failed comparisons, to review and commit. See docs/native.md.
      - name: Upload snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mortar-swift-snapshots-${{ github.sha }}
          path: |
            native/apple/Tests/MortarTests/__Snapshots__
            ${{ runner.temp }}/snapshot-failures
          if-no-files-found: ignore

  # The snapshot job above builds for Mac and tests on the iOS simulator.
  # It does not run MortarMacTests. The connector layout loop was reported
  # on macOS 26.2, so these tests also run on the macos-26 runner. Snapshot
  # comparison stays on the pinned macOS 15 simulator: rendering differs
  # by OS, and this job runs only the tests that settle without references.
  mac-layout-loop:
    name: Mac layout-loop tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          # Xcode 16.4 matches the snapshot job. Its path is not on macos-26.
          - os: macos-15
            developer_dir: /Applications/Xcode_16.4.app/Contents/Developer
          # Image default (Xcode 26). The workflow env pins Xcode 16.4,
          # which this image does not have.
          - os: macos-26
            developer_dir: /Applications/Xcode.app/Contents/Developer
    env:
      DEVELOPER_DIR: ${{ matrix.developer_dir }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          {
            echo "### Mac layout-loop runner"
            echo
            echo '```'
            sw_vers
            xcodebuild -version
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          sw_vers
          xcodebuild -version
          test -d "$DEVELOPER_DIR"
      - name: Layout-loop tests
        run: |
          set -o pipefail
          log="${RUNNER_TEMP}/mac-layout-loop.log"
          xcodebuild test -scheme Mortar \
            -destination 'platform=macOS' \
            -only-testing:MortarTests/MortarMacTests/testConnectorFormOpensAndClosesWithoutLayoutLoop \
            -only-testing:MortarTests/MortarMacTests/testConnectorSheetPresentsAndDismissesWithoutLayoutLoop \
            -only-testing:MortarTests/MortarMacTests/testFormActionsStayInARowWhenTheyFitAndStackWhenTheyDoNot \
            2>&1 | tee "$log"
          grep -q "TEST SUCCEEDED" "$log"
          for test in \
            testConnectorFormOpensAndClosesWithoutLayoutLoop \
            testConnectorSheetPresentsAndDismissesWithoutLayoutLoop \
            testFormActionsStayInARowWhenTheyFitAndStackWhenTheyDoNot
          do
            grep -E "${test}.*passed" "$log"
          done
