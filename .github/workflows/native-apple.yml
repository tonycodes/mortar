name: Mortar for SwiftUI
on:
  pull_request:
    paths:
      - Package.swift
      - native/apple/**
      - .github/workflows/native-apple.yml
  push:
    branches: [main]
    paths:
      - Package.swift
      - native/apple/**
      - .github/workflows/native-apple.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-apple-${{ github.ref }}
  cancel-in-progress: true
env:
  # The snapshot references are recorded with this Xcode and simulator;
  # rendering differs between versions, so change them only together with
  # re-recorded images.
  DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
  SIMULATOR: platform=iOS Simulator,name=iPhone 16,OS=18.6
jobs:
  test:
    name: Swift package and snapshots
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          xcodebuild -version
          xcrun simctl list runtimes available
          xcodebuild -list
      - name: Build for Mac
        run: xcodebuild build -scheme Mortar -destination 'platform=macOS' -quiet
      # The Mac itself, not iPad compatibility: windows hosting the shell and
      # forms, resized and reopened, with their own snapshot references.
      - name: Test on Mac
        env:
          TEST_RUNNER_SNAPSHOT_ARTIFACTS: ${{ runner.temp }}/snapshot-failures-mac
        run: xcodebuild test -scheme Mortar -destination 'platform=macOS'
      - name: Test on the iOS simulator
        if: ${{ !cancelled() }}
        env:
          # xcodebuild passes TEST_RUNNER_ variables to the tests, unprefixed.
          TEST_RUNNER_SNAPSHOT_ARTIFACTS: ${{ runner.temp }}/snapshot-failures
        run: |
          xcodebuild test -scheme Mortar \
            -destination "$SIMULATOR"
      # New references (recorded where none exist, which fails the test) and
      # failed comparisons, to review and commit. See docs/native.md.
      - name: Upload snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mortar-swift-snapshots-${{ github.sha }}
          path: |
            native/apple/Tests/MortarTests/__Snapshots__
            ${{ runner.temp }}/snapshot-failures
            ${{ runner.temp }}/snapshot-failures-mac
          if-no-files-found: ignore
      # TEMPORARY, removed before merge: prints new and failed snapshots so they
      # can be reviewed and committed where the artifact can't be downloaded.
      - name: Print snapshots (temporary)
        if: always()
        run: |
          {
            git ls-files --others --exclude-standard -- native/apple/Tests/MortarTests/__Snapshots__
            find "$RUNNER_TEMP/snapshot-failures" "$RUNNER_TEMP/snapshot-failures-mac" -name '*.png' 2>/dev/null
          } | while read -r f; do
            echo "SNAPSHOT-BEGIN $f"
            base64 -b 120 -i "$f"
            echo "SNAPSHOT-END $f"
          done
