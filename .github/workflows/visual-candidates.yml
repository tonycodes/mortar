name: Visual baseline candidates
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "tests/visual/**"
      - "playwright.visual.config.mjs"
      - ".github/workflows/visual-candidates.yml"
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Render proposals outside accepted baseline directory
        run: MORTAR_VISUAL_CANDIDATES=1 npm run test:visual -- --update-snapshots=all
      - uses: actions/upload-artifact@v4
        with:
          name: mortar-visual-candidates-${{ github.sha }}
          path: visual-candidates/
          retention-days: 14
      - run: echo 'These are proposed images only. Review them in a PR before copying to tests/visual/baselines. This workflow cannot satisfy the required quality check.' >> "$GITHUB_STEP_SUMMARY"
