name: Deploy playground
on:
  workflow_run:
    workflows: [Mortar contribution checks]
    branches: [main]
    types: [completed]
permissions:
  contents: read
  actions: read
concurrency:
  group: playground-production
  cancel-in-progress: false
jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment:
      name: playground-production
      url: https://ui.tony.codes/playground/
    steps:
      # Deliberately no checkout, dependency install or execution of artifact code.
      - name: Download the checked main artifact
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          [[ "$SHA" =~ ^[0-9a-f]{40}$ && "$RUN_ID" =~ ^[0-9]+$ ]]
          MAIN_SHA=$(gh api "repos/$REPO/git/ref/heads/main" --jq .object.sha)
          if [ "$MAIN_SHA" != "$SHA" ]; then
            echo 'Superseded run; waiting for the latest main checks.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          ARTIFACT_ID=$(gh api "repos/$REPO/actions/runs/$RUN_ID/artifacts" --jq ".artifacts[] | select(.name == \"mortar-playground-production-$SHA\") | .id")
          [[ "$ARTIFACT_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$REPO/actions/artifacts/$ARTIFACT_ID/zip" > "$RUNNER_TEMP/playground.zip"
          echo "ARTIFACT_ID=$ARTIFACT_ID" >> "$GITHUB_ENV"
      - name: Activate verified static release
        if: env.ARTIFACT_ID != ''
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          DEPLOY_KEY: ${{ secrets.PLAYGROUND_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ vars.PLAYGROUND_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.PLAYGROUND_DEPLOY_HOST }}
        run: |
          set -euo pipefail
          umask 077
          KEY="$RUNNER_TEMP/playground-key"
          HOSTS="$RUNNER_TEMP/playground-known-hosts"
          trap 'rm -f "$KEY" "$HOSTS"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$KEY"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOSTS"
          ssh -T -i "$KEY" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$HOSTS" \
            "mortar-playground@$DEPLOY_HOST" "deploy $SHA $RUN_ID $ARTIFACT_ID" < "$RUNNER_TEMP/playground.zip"
          echo "Deployed [$SHA](https://ui.tony.codes/playground/) after successful main checks." >> "$GITHUB_STEP_SUMMARY"
